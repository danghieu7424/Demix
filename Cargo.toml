[package]
name = "demix"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ort = { version = "2.0.0-rc.15", features = ["copy-dylibs", "ndarray"] }
rustfft = "6.2"
ndarray = "0.17"
symphonia = { version = "0.5", features = ["all"] }
thiserror = "1.0"
rayon = "1.10"
hound = "3.5"

[dev-dependencies]
cli_gui_form = { path = "cli_gui_form" }
crossterm = "0.28"
ratatui = "0.28"