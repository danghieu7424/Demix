[package]
name = "demux"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ort = { version = "2.0.0-rc.9", features = ["cuda"] }
rustfft = "6.2"
ndarray = "0.15"
symphonia = { version = "0.5", features = ["all"] }
thiserror = "1.0"
rayon = "1.10"
hound = "3.5" # Thư viện ghi file WAV dễ dàng nhất trong Rust